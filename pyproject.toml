[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-guardrails"
version = "0.9.1"
description = "A reliability layer for self-hosted LLM tool-calling. Guardrails, context management, and backend adapters for multi-step agentic workflows."
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Antoine Zambelli"}]
readme = "README.md"
keywords = ["llm", "tool-calling", "agents", "guardrails", "local-models", "ollama", "llama-cpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/antoinezambelli/forge"
Repository = "https://github.com/antoinezambelli/forge"
Documentation = "https://github.com/antoinezambelli/forge/tree/main/docs"
Changelog = "https://github.com/antoinezambelli/forge/blob/main/CHANGELOG.md"

[project.scripts]
forge-proxy = "forge.proxy.__main__:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.86.0"]
dataset-builder = ["pyarrow>=18.0.0"]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pyyaml",
    "anthropic>=0.86.0",
    "mpmath",
    "pyarrow>=18.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.hatch.build.targets.sdist]
# Without scoping, hatchling sweeps the whole tree into the sdist — pulling in
# the LFS eval datasets (~112 MB) and the eval dashboard's node_modules (~97 MB,
# incl. platform .exe/.node binaries). Ship only what builds + tests from source.
exclude = [
    "eval_results*.jsonl",
    "tests/eval/dashboard/node_modules",
    "tests/eval/dashboard/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
    "integration: explicitly invoked tests that use external processes, networking, or running backends",
    "acceptance: platform lifecycle tests that execute native or frozen artifacts",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["forge"]
